<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ibn Malik — Récap Responsables</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=DM+Sans:wght@400;500;600&display=swap');
:root{
  --teal:#0e7c7b;--teal-l:#e1f5ee;--teal-d:#0a5d5c;
  --amber:#f0a500;--amber-l:#faeeda;
  --red:#c0392b;--red-l:#fdecea;
  --blue:#1a5fa8;--gold:#c8960c;--gold-l:#fdf3d0;
  --bg:#f5f5f3;--surface:#fff;--border:#e2e0d8;
  --text:#1a1a18;--text2:#6b6b67;--text3:#b0afa8;
  --r:12px;--rs:8px;--sh:0 2px 10px rgba(0,0,0,.06);
  --c-resto:#2e7d32;--c-boissons:#1565c0;--c-glaces:#c2185b;
  --c-churros:#e65100;--c-maquillage:#7b1fa2;--c-vente:#283593;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;padding-bottom:40px}

.app-header{background:var(--teal);color:#fff;padding:14px 16px 10px;box-shadow:0 2px 14px rgba(14,124,123,.35)}
.app-header h1{font-family:'Tajawal',sans-serif;font-size:17px;font-weight:700}
.app-header p{font-size:11px;opacity:.78;margin-top:1px}
.resp-badge{display:inline-block;background:rgba(255,255,255,.2);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:4px;letter-spacing:.04em}

.panel{padding:12px;padding-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.sec{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 5px}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.stats2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 8px;text-align:center;box-shadow:var(--sh)}
.snum{font-size:20px;font-weight:700;color:var(--text)}
.snum.teal{color:var(--teal)}
.snum.gold{color:var(--gold)}
.slbl{font-size:10px;color:var(--text2);margin-top:1px}

.recap-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.recap-row:last-child{border-bottom:none}
.recap-amount{font-weight:600;color:var(--teal)}
.recap-amount.gold{color:var(--gold)}

/* Chart */
.chart-wrap{padding:8px 0}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:11px;font-weight:600;min-width:90px;color:var(--text)}
.bar-track{flex:1;background:var(--bg);border-radius:20px;height:22px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:20px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;font-weight:700;color:#fff;transition:width .6s cubic-bezier(.4,0,.2,1);min-width:4px}
.bar-val{font-size:11px;font-weight:600;min-width:54px;text-align:right;color:var(--text)}

/* Articles detail */
.art-detail-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.art-detail-row:last-child{border-bottom:none}
.art-qty-badge{background:var(--teal-l);color:var(--teal-d);font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;margin-right:6px}

/* Transactions */
.tx-item{padding:8px 0;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-top{display:flex;justify-content:space-between;align-items:center}
.tx-stand{font-size:12px;font-weight:600}
.tx-amount{font-size:13px;font-weight:700;color:var(--teal)}
.tx-amount.dinar{color:var(--gold)}
.tx-meta{font-size:11px;color:var(--text2);margin-top:2px}
.tx-detail{margin-top:4px;background:var(--bg);border-radius:6px;padding:5px 8px}
.tx-detail-item{font-size:11px;color:var(--text2);padding:1px 0}

.empty-state{font-size:13px;color:var(--text3);text-align:center;padding:12px 0}

.reset-btn{width:100%;margin-top:12px;padding:11px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;border:1.5px solid var(--red);border-radius:var(--rs);background:transparent;color:var(--red);cursor:pointer}

.refresh-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;border:1px solid var(--teal);border-radius:var(--rs);background:var(--teal-l);color:var(--teal-d);cursor:pointer;margin-bottom:10px}
</style>
</head>
<body>

<div class="app-header">
  <h1>Institut Ibn Malik — Récap</h1>
  <p>🎓 Fête de fin d'année — Samedi 13 juin 2026</p>
  <div class="resp-badge">🔒 Espace responsables</div>
</div>

<div class="panel">

  <button class="refresh-btn" onclick="loadAndRender()">🔄 Actualiser les données</button>

  <!-- TOTAUX -->
  <div class="sec">Encaissements</div>
  <div class="stats3">
    <div class="scard"><div class="snum teal" id="r-total">0€</div><div class="slbl">Total €</div></div>
    <div class="scard"><div class="snum" id="r-esp">0€</div><div class="slbl">Espèces</div></div>
    <div class="scard"><div class="snum" id="r-cb">0€</div><div class="slbl">CB</div></div>
  </div>
  <div class="stats2">
    <div class="scard"><div class="snum gold" id="r-dinar">0</div><div class="slbl">Dinars vendus</div></div>
    <div class="scard"><div class="snum teal" id="r-grand">0€</div><div class="slbl">Grand total</div></div>
  </div>

  <!-- GRAPHIQUE PAR STAND -->
  <div class="sec">Ventes par stand</div>
  <div class="card">
    <div class="chart-wrap" id="chart-stands"></div>
  </div>

  <!-- GRAPHIQUE ARTICLES -->
  <div class="sec">Articles les plus vendus</div>
  <div class="card">
    <div class="chart-wrap" id="chart-articles"></div>
  </div>

  <!-- DETAIL ARTICLES -->
  <div class="sec">Détail articles vendus</div>
  <div class="card" id="detail-articles"></div>

  <!-- TRANSACTIONS -->
  <div class="sec">Historique transactions</div>
  <div class="card" style="max-height:300px;overflow-y:auto" id="recap-tx"></div>

  <button class="reset-btn" onclick="resetAll()">🗑 Réinitialiser toute la caisse</button>
</div>

<script>
const STANDS=[
  {id:'resto',     emoji:'🍽',name:'Restauration',color:'#2e7d32'},
  {id:'boissons',  emoji:'🥤',name:'Boissons',    color:'#1565c0'},
  {id:'glaces',    emoji:'🍦',name:'Glaces',       color:'#c2185b'},
  {id:'churros',   emoji:'🥐',name:'Churros/Crêpes',color:'#e65100'},
];

let transactions=[], standTotals={}, totalEsp=0,totalCB=0,totalDinar=0,totalDinarEuro=0;

// Écouter les changements de localStorage (sync entre onglets)
window.addEventListener('storage', function(e){
  if(e.key==='ibm_state') loadAndRender();
});

function loadAndRender(){
  // Toujours repartir de zéro avant de lire
  transactions=[]; standTotals={}; totalEsp=0; totalCB=0; totalDinar=0; totalDinarEuro=0;
  STANDS.forEach(st=>standTotals[st.id]={esp:0,cb:0});
  try{
    const s=JSON.parse(localStorage.getItem('ibm_state')||'null');
    if(s){
      transactions=s.transactions||[];
      standTotals=s.standTotals||{};
      totalEsp=s.totalEsp||0; totalCB=s.totalCB||0;
      totalDinar=s.totalDinar||0; totalDinarEuro=s.totalDinarEuro||0;
      STANDS.forEach(st=>{if(!standTotals[st.id])standTotals[st.id]={esp:0,cb:0};});
    }
  }catch(e){}
  render();
}

function render(){
  const total=totalEsp+totalCB;
  document.getElementById('r-total').textContent=total.toFixed(2)+'€';
  document.getElementById('r-esp').textContent=totalEsp.toFixed(2)+'€';
  document.getElementById('r-cb').textContent=totalCB.toFixed(2)+'€';
  document.getElementById('r-dinar').textContent=totalDinar;
  document.getElementById('r-grand').textContent=total.toFixed(2)+'€';

  // Chart stands
  const standVals=STANDS.map(s=>({...s,val:(standTotals[s.id]?.esp||0)+(standTotals[s.id]?.cb||0)}));
  const maxStand=Math.max(...standVals.map(s=>s.val),1);
  document.getElementById('chart-stands').innerHTML=standVals.map(s=>`
    <div class="bar-row">
      <div class="bar-label">${s.emoji} ${s.name}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.round(s.val/maxStand*100)}%;background:${s.color}">
          ${s.val>0?s.val.toFixed(0)+'€':''}
        </div>
      </div>
      <div class="bar-val">${s.val.toFixed(2)}€</div>
    </div>`).join('');

  // Articles aggregation
  const artMap={};
  transactions.filter(t=>t.type==='euro'&&t.detail).forEach(tx=>{
    tx.detail.forEach(d=>{
      if(!artMap[d.id]) artMap[d.id]={name:d.name,qty:0,total:0,stand:d.stand};
      artMap[d.id].qty+=d.qty;
      artMap[d.id].total+=d.prix*d.qty;
    });
  });
  const arts=Object.values(artMap).sort((a,b)=>b.qty-a.qty);
  const maxQty=Math.max(...arts.map(a=>a.qty),1);

  // Chart articles
  const top8=arts.slice(0,8);
  document.getElementById('chart-articles').innerHTML=top8.length?top8.map(a=>{
    const st=STANDS.find(s=>s.id===a.stand);
    const color=st?st.color:'var(--teal)';
    return `<div class="bar-row">
      <div class="bar-label" style="font-size:10px">${a.name}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.round(a.qty/maxQty*100)}%;background:${color}">
          ${a.qty>0?a.qty+'×':''}
        </div>
      </div>
      <div class="bar-val">${a.total.toFixed(2)}€</div>
    </div>`;}).join(''):'<div class="empty-state">Aucune vente</div>';

  // Detail articles
  document.getElementById('detail-articles').innerHTML=arts.length?arts.map(a=>{
    const st=STANDS.find(s=>s.id===a.stand);
    return `<div class="art-detail-row">
      <div><span class="art-qty-badge">${a.qty}×</span>${a.name}${st?` <span style="font-size:10px;color:var(--text3)">${st.emoji}</span>`:''}</div>
      <span style="font-weight:600;color:var(--teal)">${a.total.toFixed(2)} €</span>
    </div>`;}).join(''):'<div class="empty-state">Aucun article vendu</div>';

  // Transactions
  const rt=document.getElementById('recap-tx');
  if(!transactions.length){rt.innerHTML='<div class="empty-state">Aucune transaction</div>';return;}
  rt.innerHTML=transactions.slice(0,80).map(tx=>{
    if(tx.type==='euro'){
      const detail=tx.detail&&tx.detail.length?
        `<div class="tx-detail">${tx.detail.map(d=>{
          const st=STANDS.find(s=>s.id===d.stand);
          const emoji=st?st.emoji:'';
          return `<div class="tx-detail-item">${d.qty}× ${emoji} ${d.name} — ${(d.prixTotal||d.prix*d.qty).toFixed(2)}€</div>`;
        }).join('')}</div>`:'';
      return `<div class="tx-item">
        <div class="tx-top">
          <div><span class="tx-stand">🛒 Vente</span></div>
          <span class="tx-amount">+${tx.montant.toFixed(2)} €</span>
        </div>
        <div class="tx-meta">${tx.time} · ${tx.mode==='especes'?'💵 Espèces':'💳 CB'}</div>
        ${detail}
      </div>`;
    }
    return `<div class="tx-item">
      <div class="tx-top">
        <div><span class="tx-stand">🪙 Dinars Ibn Malik</span></div>
        <span class="tx-amount dinar">${tx.dinars} Dinar${tx.dinars>1?'s':''}</span>
      </div>
      <div class="tx-meta">${tx.time} · ${tx.mode==='especes'?'💵 Espèces':'💳 CB'} · ${tx.valDinars.toFixed(2)}€</div>
    </div>`;
  }).join('');
}

function resetAll(){
  if(!confirm('Réinitialiser toute la caisse ? Cette action est irréversible.')) return;
  transactions=[]; standTotals={}; totalEsp=0;totalCB=0;totalDinar=0;totalDinarEuro=0;
  STANDS.forEach(s=>standTotals[s.id]={esp:0,cb:0});
  // Écrire explicitement l'état vide — les deux fichiers liront la même chose
  const emptyState={transactions:[],standTotals:{},totalEsp:0,totalCB:0,totalDinar:0,totalDinarEuro:0,ts:Date.now()};
  try{
    localStorage.removeItem('ibm_state');
    localStorage.setItem('ibm_state', JSON.stringify(emptyState));
  }catch(e){}
  render();
}

loadAndRender();
</script>
</body>
</html>
